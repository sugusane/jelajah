<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cetak QR Code Booth — Panitia JELAJAH Expo PMW</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #F4F3EE;
      color: #17241E;
      padding: 24px;
    }

    .no-print {
      max-width: 900px;
      margin: 0 auto 24px;
      background: #FFFFFF;
      border: 2px solid #153726;
      border-radius: 16px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    .no-print h1 {
      font-family: 'Fredoka';
      font-size: 22px;
      color: #153726;
    }

    .no-print p {
      font-size: 13px;
      color: #57655E;
      margin-top: 4px;
    }

    .btn-print {
      background: #F0A93E;
      color: #0E2519;
      font-family: 'Fredoka';
      font-size: 16px;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      box-shadow: 0 3px 0 #C9821F;
    }

    .btn-print:hover {
      filter: brightness(1.05);
    }

    /* PRINT GRID (A4 Friendly: 4 Cards per Page) */
    .print-grid {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .booth-card {
      background: #FFFFFF;
      border: 2.5px solid #153726;
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      page-break-inside: avoid;
    }

    .card-top-tag {
      font-family: 'Fredoka';
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #F0A93E;
      background: #153726;
      padding: 3px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .card-booth-label {
      font-family: 'Fredoka';
      font-size: 20px;
      color: #153726;
      margin-bottom: 4px;
    }

    .card-booth-sub {
      font-size: 12px;
      color: #57655E;
      margin-bottom: 12px;
    }

    .qr-container {
      width: 160px;
      height: 160px;
      border: 2px solid #153726;
      border-radius: 12px;
      padding: 8px;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .code-badge-box {
      background: #FBEFD9;
      border: 1.5px dashed #C9821F;
      border-radius: 8px;
      padding: 6px 14px;
      margin-bottom: 10px;
      width: 100%;
    }

    .code-badge-box span {
      font-size: 11px;
      color: #634710;
      font-weight: 600;
      display: block;
    }

    .code-badge-box strong {
      font-family: 'Fredoka', monospace;
      font-size: 18px;
      color: #153726;
      letter-spacing: 2px;
    }

    .card-instructions {
      font-size: 11px;
      color: #57655E;
      line-height: 1.4;
    }

    .card-footer-url {
      margin-top: 10px;
      font-family: 'Fredoka';
      font-size: 12px;
      color: #2B8C82;
      font-weight: 700;
    }

    @media print {
      body { background: #FFF; padding: 0; }
      .no-print { display: none; }
      .print-grid { gap: 14px; }
      .booth-card { border-width: 2px; }
    }
  </style>
</head>
<body>

  <!-- ADMIN TOOLBAR (HIDDEN WHEN PRINTING) -->
  <div class="no-print">
    <div style="flex:1;">
      <h1>🖨️ Lembar Cetak QR Code &amp; Kode Booth JELAJAH</h1>
      <p>Otomatis sinkron dengan database misi/booth di server. Pilih kategori atau cari booth yang ingin dicetak.</p>
      <div style="margin-top:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <select id="filterCategory" style="padding:8px 12px; border-radius:8px; border:1.5px solid #153726; font-size:13px; font-weight:600; outline:none; background:#FFF;">
          <option value="all">Semua Kategori (Tampilkan Semua)</option>
          <option value="makanan">🍔 Klaster Kuliner (1-12)</option>
          <option value="sponsor">🏢 Klaster Sponsor (A-M)</option>
          <option value="special">📍 Spot Khusus &amp; Panggung</option>
        </select>
        <input type="text" id="searchBooth" placeholder="Cari nama booth / ID..." style="padding:8px 12px; border-radius:8px; border:1.5px solid #153726; font-size:13px; width:220px; outline:none; background:#FFF;" />
        <span id="boothCountInfo" style="font-size:12.5px; font-weight:600; color:#57655E;">Memuat data booth...</span>
      </div>
    </div>
    <div style="display:flex; flex-direction:column; gap:8px; align-items:flex-end;">
      <button class="btn-print" onclick="window.print()">🖨️ Cetak Kartu Tampil (A4)</button>
      <a href="admin.html" style="font-size:12px; color:#153726; font-weight:600; text-decoration:none;">← Kembali ke Panel Admin</a>
    </div>
  </div>

  <!-- PRINTABLE CARDS CONTAINER -->
  <div class="print-grid" id="cardsGrid">
    <!-- Populated by JS -->
  </div>

  <script src="js/map-data.js"></script>
  <script src="js/qrcode.min.js"></script>
  <script>
    let allLocations = [];
    const grid = document.getElementById('cardsGrid');
    const filterCat = document.getElementById('filterCategory');
    const searchInput = document.getElementById('searchBooth');
    const countInfo = document.getElementById('boothCountInfo');

    async function loadLocations() {
      try {
        const res = await fetch('/api/missions');
        if (res.ok) {
          const data = await res.json();
          if (data.missions && data.missions.length > 0) {
            allLocations = data.missions;
          }
        }
      } catch (e) {
        console.warn('Gagal memuat misi dari API, fallback ke map-data.js:', e);
      }

      if (!allLocations || allLocations.length === 0) {
        allLocations = (window.JELAJAH_DATA && window.JELAJAH_DATA.locations) ? window.JELAJAH_DATA.locations : [];
      }

      renderCards();
    }

    function renderCards() {
      grid.innerHTML = '';
      const cat = filterCat.value;
      const q = searchInput.value.toLowerCase().trim();

      const filtered = allLocations.filter(loc => {
        if (cat !== 'all' && loc.category !== cat) return false;
        if (q) {
          const matchName = (loc.name || '').toLowerCase().includes(q);
          const matchId = (loc.id || '').toLowerCase().includes(q);
          const matchZone = (loc.zone || '').toLowerCase().includes(q);
          if (!matchName && !matchId && !matchZone) return false;
        }
        return true;
      });

      countInfo.textContent = `Menampilkan ${filtered.length} dari ${allLocations.length} booth`;

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:#57655E;">Tidak ada booth yang cocok dengan filter.</div>';
        return;
      }

      filtered.forEach((loc, idx) => {
        const card = document.createElement('div');
        card.className = 'booth-card';
        const targetUrl = `https://jelajah.tech/?mission=${loc.id}`;
        const codeDisplay = loc.secretCode || ('JLJ-' + loc.id.toUpperCase().replace('BOOTH-', '').replace('SPOT-', ''));
        const qrId = `qr-booth-${loc.id}-${idx}`;

        card.innerHTML = `
          <div class="card-top-tag">PILOT EXPO PMW 2026</div>
          <div class="card-booth-label">${loc.name}</div>
          <div class="card-booth-sub">${loc.zone || 'Expo Area'} · <strong>+${loc.points} Poin</strong></div>
          <div class="qr-container" id="${qrId}" style="display:flex; align-items:center; justify-content:center;"></div>
          <div class="code-badge-box">
            <span>KODE RAHASIA JELAJAH:</span>
            <strong>${codeDisplay}</strong>
          </div>
          <div class="card-instructions">
            Scan QR atau masukkan kode rahasia di atas untuk klaim poin &amp; tukar hadiah voucher!
          </div>
          <div class="card-footer-url">🌐 Buka: jelajah.tech</div>
        `;

        grid.appendChild(card);

        const qrContainer = document.getElementById(qrId);
        if (qrContainer && window.QRCode) {
          new window.QRCode(qrContainer, {
            text: targetUrl,
            width: 136,
            height: 136,
            colorDark: '#0A8754',
            colorLight: '#ffffff',
            correctLevel: window.QRCode.CorrectLevel.M
          });
        }
      });
    }

    filterCat.addEventListener('change', renderCards);
    searchInput.addEventListener('input', renderCards);

    loadLocations();
  </script>
</body>
</html>
